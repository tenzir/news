name: Relay stable changelog releases to X drafting

# Thin shim: reports newly added stable release manifests to the `workflows`
# Cloudflare Worker (tenzir/infra:/website/workflows). The Worker fetches the
# pinned release, drafts one post, waits for its permanent page, and publishes
# through a release-scoped ledger. This workflow only discovers and relays.

on:
  push:
    branches: [main]
    paths:
      - "*/changelog/releases/*/manifest.yaml"
  workflow_dispatch:
    inputs:
      project:
        description: Top-level changelog project
        required: true
        type: string
      version:
        description: Stable release version in vX.Y.Z form
        required: true
        type: string
      dry_run:
        description: Draft and validate without publishing
        required: false
        default: true
        type: boolean
      retry_ambiguous:
        description: Retry after deleting the uncertain X post
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: changelog-x-relay
  cancel-in-progress: false

jobs:
  relay:
    name: Relay to workflows Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip notifications]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect stable releases
        id: collect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before || '' }}
          AFTER: ${{ github.event.after || github.sha }}
          PROJECT: ${{ github.event.inputs.project || '' }}
          VERSION: ${{ github.event.inputs.version || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RETRY_AMBIGUOUS: ${{ github.event.inputs.retry_ambiguous || 'false' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python .github/scripts/changelog_x_relay.py manual \
              --after "$AFTER" \
              --project "$PROJECT" \
              --version "$VERSION" \
              --dry-run "$DRY_RUN" \
              --retry-ambiguous "$RETRY_AMBIGUOUS" > /tmp/payloads.jsonl
          else
            python .github/scripts/changelog_x_relay.py push \
              --before "$BEFORE" \
              --after "$AFTER" > /tmp/payloads.jsonl
          fi
          if [ ! -s /tmp/payloads.jsonl ]; then
            echo "No newly added stable releases; nothing to relay."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < /tmp/payloads.jsonl | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/payloads.jsonl

      - name: Dispatch release drafting workflows
        if: steps.collect.outputs.skip == 'false'
        env:
          WORKFLOWS_NEWS_TOKEN: ${{ secrets.WORKFLOWS_NEWS_TOKEN }}
        run: |
          {
            echo "## Changelog X relay"
            echo
            echo "Dispatched ${{ steps.collect.outputs.count }} stable release(s):"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while IFS= read -r payload; do
            project="$(jq -r .project <<< "$payload")"
            version="$(jq -r .version <<< "$payload")"
            if ! response="$(curl --fail-with-body --silent --show-error \
              -X POST https://workflows.tenzir.workers.dev/changelog/x \
              -H "Authorization: Bearer $WORKFLOWS_NEWS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")"; then
              printf -- '- `%s/%s`: dispatch failed\n' "$project" "$version" \
                >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            echo "$response"
            if ! id="$(jq -er .id <<< "$response")"; then
              printf -- '- `%s/%s`: invalid Worker response\n' \
                "$project" "$version" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            printf -- '- `%s/%s`: `%s`\n' "$project" "$version" "$id" \
              >> "$GITHUB_STEP_SUMMARY"
            printf '  `wrangler workflows instances describe changelog-x %s`\n' \
              "$id" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/payloads.jsonl
          exit "$failed"
