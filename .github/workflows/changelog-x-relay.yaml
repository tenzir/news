name: Relay stable changelog releases to X drafting

# Sends one eligible stable release URL to the workflows Worker. Automatic
# posts are limited to the tenzir and platform projects, and pushes containing
# multiple eligible releases require manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "*/changelog/releases/*/manifest.yaml"
  workflow_dispatch:
    inputs:
      url:
        description: Canonical stable release URL
        required: true
        type: string
      dry_run:
        description: Draft and validate without publishing
        required: false
        default: true
        type: boolean
      retry_ambiguous:
        description: Retry after deleting the uncertain X post
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: changelog-x-relay
  cancel-in-progress: false

jobs:
  relay:
    name: Relay to workflows Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip notifications]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect stable releases
        id: collect
        env:
          BEFORE: ${{ github.event.before || '' }}
          AFTER: ${{ github.event.after || github.sha }}
          URL: ${{ github.event.inputs.url || '' }}
        run: |
          if [ -n "$URL" ]; then
            printf '%s\n' "$URL" > /tmp/urls
          else
            before="$BEFORE"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git hash-object -t tree /dev/null)"
            fi
            git diff --name-only --diff-filter=AR "$before" "$AFTER" -- \
              ':(glob)*/changelog/releases/*/manifest.yaml' |
              while IFS= read -r manifest; do
                project="${manifest%%/*}"
                case "$project" in
                  tenzir|platform) ;;
                  *) continue ;;
                esac
                version="${manifest%/manifest.yaml}"
                version="${version##*/}"
                if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  id="$(awk '$1 == "id:" { \
                    value = $2; gsub(/"/, "", value); \
                    gsub(/\047/, "", value); print value; exit \
                  }' \
                    "$project/changelog/config.yaml")"
                  id="${id:-$project}"
                  if [[ ! "$id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
                    echo "Invalid changelog id for $project: $id" >&2
                    exit 1
                  fi
                  printf 'https://tenzir.com/changelog/%s/%s/\n' "$id" "$version"
                fi
              done > /tmp/urls
            count="$(wc -l < /tmp/urls | tr -d ' ')"
            if [ "$count" -gt 1 ]; then
              echo "::error::Refusing to dispatch $count releases from one push; dispatch the intended URL manually."
              exit 1
            fi
          fi
          if [ ! -s /tmp/urls ]; then
            echo "No newly added stable releases; nothing to relay."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat /tmp/urls

      - name: Dispatch release drafting workflow
        if: steps.collect.outputs.skip == 'false'
        env:
          WORKFLOWS_NEWS_TOKEN: ${{ secrets.WORKFLOWS_NEWS_TOKEN }}
        run: |
          while IFS= read -r url; do
            payload="$(jq --null-input --compact-output \
              --arg url "$url" \
              --argjson force "${{ github.event_name == 'workflow_dispatch' }}" \
              --argjson dryRun "${{ github.event.inputs.dry_run || 'false' }}" \
              --argjson retry "${{ github.event.inputs.retry_ambiguous || 'false' }}" \
              '{url: $url, force: $force, dryRun: $dryRun, retryAmbiguous: $retry}')"
            response="$(curl --fail-with-body --silent --show-error \
              -X POST https://workflows.tenzir.workers.dev/changelog/x \
              -H "Authorization: Bearer $WORKFLOWS_NEWS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")"
            echo "$response"
            printf -- '- <%s>: `%s`\n' "$url" "$(jq -r .id <<< "$response")" \
              >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/urls
