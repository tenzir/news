name: Sync

on:
  workflow_dispatch:
    inputs:
      # The validation step verifies via GitHub API that the repository exists
      # in the tenzir organization, rejecting path traversal and typos.
      project:
        description: "Project identity and target directory name"
        required: true
        type: string
      source_repo:
        description: "Repository to clone the changelog from (defaults to project)"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Full source commit SHA to synchronize (defaults to HEAD)"
        required: false
        default: ""
        type: string
      target:
        description: "Target directory name (defaults to project name)"
        required: false
        type: string
      path:
        description: "Path to changelog directory in source repo"
        required: false
        default: "changelog"
        type: string
      extra_paths:
        description: "Additional paths to sync (space-separated)"
        required: false
        default: ""
        type: string
      skip_notifications:
        description: "Skip notifications (for initial imports)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "sync"
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TENZIR_GITHUB_APP_ID }}
          private-key: ${{ secrets.TENZIR_GITHUB_APP_PRIVATE_KEY }}
          owner: tenzir

      - name: Resolve target directory
        id: resolve
        run: |
          target="${{ inputs.target }}"
          source_repo="${{ inputs.source_repo }}"
          echo "dir=${target:-${{ inputs.project }}}" >> "$GITHUB_OUTPUT"
          echo "repo=${source_repo:-${{ inputs.project }}}" >> "$GITHUB_OUTPUT"

      # Notification routing is a policy of this repository, so callers can't
      # choose a channel. Masked secrets stay masked in later steps.
      - name: Select Discord webhooks
        env:
          TARGET: ${{ steps.resolve.outputs.dir }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_LIBRARY_WEBHOOK: ${{ secrets.DISCORD_LIBRARY_WEBHOOK }}
        run: |
          case "$TARGET" in
            library)
              entry="$DISCORD_LIBRARY_WEBHOOK"
              release="$DISCORD_LIBRARY_WEBHOOK"
              ;;
            *)
              entry="$DISCORD_CHANGELOG_WEBHOOK"
              release="$DISCORD_RELEASE_WEBHOOK"
              ;;
          esac
          echo "ENTRY_WEBHOOK=$entry" >> "$GITHUB_ENV"
          echo "RELEASE_WEBHOOK=$release" >> "$GITHUB_ENV"

      - name: Validate project and source repository names
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for repo in "${{ inputs.project }}" "${{ steps.resolve.outputs.repo }}"; do
            if ! gh api "repos/tenzir/${repo}" --silent; then
              echo "::error::Repository tenzir/${repo} does not exist"
              exit 1
            fi
          done

      - name: Clone source repository
        id: clone
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ -n "$SOURCE_REF" && ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a full commit SHA"
            exit 1
          fi
          git init --quiet /tmp/source
          git -C /tmp/source remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/tenzir/${{ steps.resolve.outputs.repo }}.git"
          git -C /tmp/source fetch --depth 1 --quiet origin "${SOURCE_REF:-HEAD}"
          git -C /tmp/source checkout --detach --quiet FETCH_HEAD
          echo "sha=$(git -C /tmp/source rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git -C /tmp/source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A source without a changelog at path but with top-level packages, each
      # with package.yaml and changelog/, is a package library.
      - name: Detect source layout
        env:
          SOURCE_PATH: ${{ inputs.path }}
          EXTRA_PATHS: ${{ inputs.extra_paths }}
        run: |
          if [[ -d "/tmp/source/$SOURCE_PATH" ]]; then
            packages=false
          elif compgen -G "/tmp/source/*/package.yaml" > /dev/null; then
            packages=true
            if [[ -n "$EXTRA_PATHS" ]]; then
              echo "::error::extra_paths does not apply to package libraries"
              exit 1
            fi
          else
            echo "::error::Source has neither $SOURCE_PATH/ nor packages"
            exit 1
          fi
          echo "Package library: $packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"

      - name: Snapshot existing files
        id: snapshot
        run: |
          # Record existing unreleased entries and releases before sync
          # Only track unreleased/ - entries in releases/*/entries/ are archived
          # copies that were already notified when they were unreleased
          find "${{ steps.resolve.outputs.dir }}" -path "*/unreleased/*.md" 2>/dev/null | sort > /tmp/entries-before.txt || true
          .github/scripts/list-releases.sh "${{ steps.resolve.outputs.dir }}" "$PACKAGES" > /tmp/releases-before.txt

      - name: Sync changelog
        if: env.PACKAGES != 'true'
        run: |
          mkdir -p "${{ steps.resolve.outputs.dir }}/changelog"
          rsync -av --delete "/tmp/source/${{ inputs.path }}/" "${{ steps.resolve.outputs.dir }}/changelog/"

      - name: Sync package changelogs
        if: env.PACKAGES == 'true'
        run: .github/scripts/sync-packages.sh /tmp/source "${{ steps.resolve.outputs.dir }}"

      - name: Sync extra paths
        if: inputs.extra_paths != ''
        run: |
          cd /tmp/source
          EXTRA_PATHS='${{ inputs.extra_paths }}'
          # shellcheck disable=SC2206 # Intentional splitting of a space-separated input.
          patterns=($EXTRA_PATHS)
          for pattern in "${patterns[@]}"; do
            # shellcheck disable=SC2086 # Intentional glob expansion from configured patterns.
            for path in $pattern; do
              if [[ -d "$path" ]]; then
                mkdir -p "$GITHUB_WORKSPACE/${{ steps.resolve.outputs.dir }}/$path"
                rsync -av --delete "$path/" "$GITHUB_WORKSPACE/${{ steps.resolve.outputs.dir }}/$path/"
              fi
            done
          done

      - name: Clean orphaned extra paths
        if: inputs.extra_paths != ''
        run: |
          EXTRA_PATHS='${{ inputs.extra_paths }}'
          # shellcheck disable=SC2206 # Intentional splitting of a space-separated input.
          paths=($EXTRA_PATHS)
          .github/scripts/clean-orphaned-paths.sh "${{ steps.resolve.outputs.dir }}" "${paths[@]}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      # Packages don't appear on /changelog and have no X campaigns.
      - name: Validate campaign identities
        if: env.PACKAGES != 'true'
        run: >-
          python .github/scripts/changelog.py
          "${{ steps.resolve.outputs.dir }}"

      - name: Stage changes
        run: git add .

      - name: Commit changes
        uses: planetscale/ghcommit-action@v0.2.0
        with:
          commit_message: >-
            Sync changelog from tenzir/${{ steps.resolve.outputs.repo }}@${{ steps.clone.outputs.sha }}${{ inputs.skip_notifications && ' [skip notifications]' || '' }}
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          empty: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Install notification dependencies
        if: env.ENTRY_WEBHOOK != '' || env.RELEASE_WEBHOOK != ''
        run: python -m pip install --requirement .github/scripts/requirements.txt

      - name: Notify Discord of new entries
        if: env.ENTRY_WEBHOOK != '' && !inputs.skip_notifications
        env:
          DIR: ${{ steps.resolve.outputs.dir }}
          REPOSITORY: tenzir/${{ steps.resolve.outputs.repo }}
          SOURCE_SHA: ${{ steps.clone.outputs.full_sha }}
        run: |
          # Find new unreleased entries only - released entries were already
          # notified when they were in unreleased/
          find "${{ steps.resolve.outputs.dir }}" -path "*/unreleased/*.md" 2>/dev/null | sort > /tmp/entries-after.txt || true
          comm -13 /tmp/entries-before.txt /tmp/entries-after.txt > /tmp/new-entries.txt || true

          # Send notification for each new entry
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            echo "Notifying Discord about new entry: $entry"
            if [[ "$PACKAGES" == "true" ]]; then
              package="${entry#"$DIR"/}"
              package="${package%%/*}"
              python .github/scripts/discord-notify.py package-entry \
                "$DIR/$package" "$entry" "$ENTRY_WEBHOOK" \
                --repository "$REPOSITORY" --ref "$SOURCE_SHA" || true
            else
              python .github/scripts/discord-notify.py entry "$DIR" "$entry" "$ENTRY_WEBHOOK" || true
            fi
            sleep 1  # Rate limiting
          done < /tmp/new-entries.txt

      - name: Notify Discord of new releases
        if: env.RELEASE_WEBHOOK != '' && !inputs.skip_notifications
        env:
          DIR: ${{ steps.resolve.outputs.dir }}
        run: |
          .github/scripts/list-releases.sh "$DIR" "$PACKAGES" > /tmp/releases-after.txt
          comm -13 /tmp/releases-before.txt /tmp/releases-after.txt > /tmp/new-releases.txt || true

          # Send notification for each new release
          while IFS= read -r release_dir; do
            [[ -z "$release_dir" ]] && continue
            version=$(basename "$release_dir")
            # The project or package directory that holds changelog/.
            # tenzir-ship reads a package's metadata from its package.yaml.
            root="${release_dir%/changelog/releases/*}"
            echo "Notifying Discord about new release: $root $version"
            # Export structured release data; the notification lists entry
            # titles only and links to the full notes on the website.
            if ! tenzir-ship --root "$root/changelog" \
              show "$version" --release --json > /tmp/release.json; then
              echo "::warning::Failed to export release $root $version"
              continue
            fi
            if [[ "$PACKAGES" == "true" ]]; then
              python .github/scripts/discord-notify.py package-release "$root" /tmp/release.json "$RELEASE_WEBHOOK" || true
            else
              python .github/scripts/discord-notify.py release "$DIR" /tmp/release.json "$RELEASE_WEBHOOK" || true
            fi
            sleep 1  # Rate limiting
          done < /tmp/new-releases.txt
